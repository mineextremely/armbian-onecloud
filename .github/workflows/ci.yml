name: CI

on:
  workflow_dispatch:
    inputs:
      releases:- name: Install tools
        description: "Target OS releases (comma separated)"
        required: false
        default: "noble,bookworm"
      branches:
        description: "Kernel branches (comma separated)"
        required: false
        default: "current"
  push:
    branches:
      - readme
    paths:
      - .github/workflows/ci.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot
  UBOOT_TAG: build-20221028-0940
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      env: ${{ steps.meta.outputs.env }}
      releases: ${{ steps.matrix.outputs.releases }}
      branches: ${{ steps.matrix.outputs.branches }}

    steps:
      - id: meta
        name: Collect metadata
        run: |
          TIME="$(date -u +'%Y-%m-%d %H:%M:%S %Z')"
          TAG="ci-$(date -u +'%Y%m%d-%H%M%S')"

          SCRIPT_SHA=$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          ARMBIAN_SHA=$(curl -s https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)

          cat <<EOF >>$GITHUB_ENV
          TIME=$TIME
          TAG=$TAG
          SCRIPT_SHA=$SCRIPT_SHA
          UBOOT_TAG=$UBOOT_TAG
          ARMBIAN_SHA=$ARMBIAN_SHA
          EOF

          echo "env=$(cat $GITHUB_ENV | base64 -w0)" >>$GITHUB_OUTPUT

      - id: matrix
        name: Build matrix
        run: |
          rel="${{ github.event.inputs.releases || 'noble,bookworm' }}"
          br="${{ github.event.inputs.branches || 'current' }}"

          rel_json=$(printf '%s' "$rel" | jq -cR 'split(",")')
          br_json=$(printf '%s' "$br" | jq -cR 'split(",")')

          echo "releases=$rel_json" >> "$GITHUB_OUTPUT"
          echo "branches=$br_json" >> "$GITHUB_OUTPUT"


      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CI ${{ env.TIME }}
          body: |
            **Sources**
            - Script: ${{ env.SCRIPT_REPO }}@${{ env.SCRIPT_REF }}
            - Armbian: ${{ env.ARMBIAN_REPO }}@${{ env.ARMBIAN_REF }}
            - U-Boot: ${{ env.UBOOT_REPO }}@${{ env.UBOOT_RELEASE }}

  build-debs:
    name: Build kernel (${{ matrix.branch }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}

    steps:
      - run: echo "$(echo '${{ needs.prepare.outputs.env }}' | base64 -d)" >>$GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Build kernel
        run: |
          export GITHUB_ACTIONS=false
          sudo ./compile.sh kernel \
            ALLOW_ROOT=yes \
            BOARD=onecloud \
            BRANCH=${{ matrix.branch }} \
            EXPERT=yes \
            USE_CCACHE=no

          sudo chown $(id -u):$(id -g) -R output/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.branch }}
          path: output/debs/*

  build:
    name: Build ${{ matrix.release }}-${{ matrix.branch }}
    needs: [prepare, build-debs]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.releases) }}
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}

    steps:
      - run: echo "$(echo '${{ needs.prepare.outputs.env }}' | base64 -d)" >>$GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.branch }}
          path: output/debs/

      - name: Build image
        run: |
          export GITHUB_ACTIONS=false
          sudo ./compile.sh build \
            ALLOW_ROOT=yes \
            BOARD=onecloud \
            BRANCH=${{ matrix.branch }} \
            RELEASE=${{ matrix.release }} \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            USE_CCACHE=no \
            COMPRESS_OUTPUTIMAGE=img

          sudo chown $(id -u):$(id -g) -R output/

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils

          ver=v0.3.1
          curl -L -o AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x AmlImg

      - name: Build burn.img
        run: |
          curl -L -o uboot.img \
            https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}

          # sanity check
          if [ ! -s uboot.img ] || [ "$(stat -c%s uboot.img)" -lt 1048576 ]; then
            echo "❌ uboot.img looks invalid"
            ls -l uboot.img
            exit 1
          fi
          
          ./AmlImg unpack uboot.img burn/

          diskimg=$(ls output/images/*.img)
          loop=$(sudo losetup --find --show --partscan $diskimg)

          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop

          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" > burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" > burn/rootfs.VERIFY

          cat <<EOF >> burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          prefix=$(ls output/images/*.img | sed 's/\.img$//')
          ./AmlImg pack ${prefix}.burn.img burn/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: output/images/*

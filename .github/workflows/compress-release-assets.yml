name: Compress release images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to compress (leave empty = latest)"
        required: false

jobs:
  compress:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 允许向 release 上传文件

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils p7zip-full

      - name: Download release image assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*.img*"
          out-file-path: assets

      - name: Prepare image list
        id: images
        run: |
          cd assets
          ls *.img *.burn.img 2>/dev/null | grep -v '\.txt$' > /tmp/images.list
          cat /tmp/images.list

      # ----------------------------
      # ZSTD (最快，优先)
      # ----------------------------
      - name: Compress with ZSTD (balanced, fast)
        run: |
          cd assets
          while read -r img; do
            echo "ZSTD compressing $img"
            zstd -T0 -19 -k "$img"
          done < /tmp/images.list

      - name: Upload ZSTD assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: assets/*.zst

      # ----------------------------
      # 7Z (正常压缩，Windows 友好)
      # ----------------------------
      - name: Compress with 7Z (normal)
        run: |
          cd assets
          while read -r img; do
            echo "7Z compressing $img"
            7z a -t7z -mx=9 "$img.7z" "$img"
          done < /tmp/images.list

      - name: Upload 7Z assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: assets/*.7z

      # ----------------------------
      # XZ (极限压缩，最慢，最后)
      # ----------------------------
      - name: Compress with XZ (maximum)
        run: |
          cd assets
          while read -r img; do
            echo "XZ compressing $img"
            xz -T0 -9e -k "$img"
          done < /tmp/images.list

      - name: Upload XZ assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: assets/*.xz

name: Compress release images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to compress (leave empty = latest)"
        required: false

jobs:
  compress:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 允许向 release 上传文件

    steps:
      # ------------------------------------------------------------
      # Resolve release tag (works for release + workflow_dispatch)
      # ------------------------------------------------------------
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Using manually provided tag: $TAG"

          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "Using release event tag: $TAG"

          else
            echo "No tag provided, querying latest release..."
            TAG=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r .tag_name)

            if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
              echo "❌ Failed to determine latest release tag"
              exit 1
            fi
          fi

          echo "Resolved tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # Install compression tools
      # ------------------------------------------------------------
      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils p7zip-full

      # ------------------------------------------------------------
      # Download .img / .burn.img assets from release
      # ------------------------------------------------------------
      - name: Download release image assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ steps.tag.outputs.tag }}
          fileName: "*.img*"
          out-file-path: assets

      # ------------------------------------------------------------
      # Prepare image list (exclude .txt, tolerate missing matches)
      # ------------------------------------------------------------
      - name: Prepare image list
        id: images
        run: |
          cd assets

          ls *.img *.burn.img 2>/dev/null \
            | grep -v '\.txt$' \
            > /tmp/images.list || true

          if [ ! -s /tmp/images.list ]; then
            echo "❌ No image files found to compress"
            exit 1
          fi

          echo "Images to compress:"
          cat /tmp/images.list

      # ============================================================
      # ZSTD — fastest (run first)
      # ============================================================
      - name: Compress with ZSTD (balanced, fast)
        run: |
          cd assets
          while read -r img; do
            echo "ZSTD compressing $img"
            zstd -T0 -19 -k "$img"
          done < /tmp/images.list

      - name: Upload ZSTD assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: assets/*.zst

      # ============================================================
      # 7Z — normal compression (Windows friendly)
      # ============================================================
      - name: Compress with 7Z (normal)
        run: |
          cd assets
          while read -r img; do
            echo "7Z compressing $img"
            7z a -t7z -mx=9 "$img.7z" "$img"
          done < /tmp/images.list

      - name: Upload 7Z assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: assets/*.7z

      # ============================================================
      # XZ — maximum compression (slowest, last)
      # ============================================================
      - name: Compress with XZ (maximum)
        run: |
          cd assets
          while read -r img; do
            echo "XZ compressing $img"
            xz -T0 -9e -k "$img"
          done < /tmp/images.list

      - name: Upload XZ assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: assets/*.xz
